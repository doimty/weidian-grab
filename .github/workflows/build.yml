name: build-weidian-grab

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS.sdk"

      - name: Install signing/packaging tools
        run: |
          brew install ldid dpkg
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 THEOS="$THEOS" 2>&1 | tee /tmp/build.log | tail -60
          echo "--- deb output ---"
          find . -name "*.deb" -newermt "-10 minutes" | tee /tmp/debs.txt
          test -s /tmp/debs.txt

      - name: Inspect package
        run: |
          set -e
          DEB="$(find . -name '*.deb' -newermt '-10 minutes' | head -1)"
          echo "deb: $DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"
          mkdir -p out && cp "$DEB" out/
      - uses: actions/upload-artifact@v4
        with:
          name: weidian-grab-deb
          path: out/*.deb
          if-no-files-found: error
