name: build-weidian-grab

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS.sdk"

      - name: Install signing/packaging tools
        run: |
          brew install ldid dpkg
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          make package FINALPACKAGE=1 THEOS="$THEOS" 2>&1 | tail -50
          ls -la packages/ || true

      - name: Normalise architecture to iphoneos-arm64e
        run: |
          set -e
          cd packages
          SRC="$(ls *.deb | head -1)"
          echo "source: $SRC"
          dpkg-deb -I "$SRC" | head -20 || true
          rm -rf pkgroot
          dpkg-deb -R "$SRC" pkgroot
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64e/' pkgroot/DEBIAN/control
          sed -i '' 's/^Depends:.*/Depends: mobilesubstrate, firmware (>= 15.0), roothide/' pkgroot/DEBIAN/control
          cat pkgroot/DEBIAN/control
          OUT="com.koudai.weidian.grab_0.1.0_iphoneos-arm64e.deb"
          rm -f *.deb
          dpkg-deb -b pkgroot "$OUT"
          dpkg-deb -c "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: weidian-grab-deb
          path: packages/*.deb
          if-no-files-found: error
